<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#b26bff"/><stop offset="1" stop-color="#ff8a2b"/></linearGradient>
<style>.t{font-size:16px;font-weight:600;fill:#c9c9d1}.c{font-size:12px;fill:#8a8a95}.n{font-size:13px;fill:#c9c9d1}.v{font-size:12px;fill:#c9c9d1;font-family:ui-monospace,Menlo,monospace}.f{font-size:11px;fill:#8a8a95}</style></defs>
<rect width="900" height="330" rx="12" fill="#0d0b12"/>
<text x="30" y="40" class="t">Answering</text>
<text x="30" y="60" class="c">Inkling 2 Mini, tokens per second, higher is better</text>
<text x="30" y="97" class="n">Saetta, prompt lookup</text>
