<text x="470" y="40" class="t">Prompt reading</text>
<text x="470" y="60" class="c">4,096-token prompt, tokens per second</text>
<text x="470" y="97" class="n">Strata</text>
<rect x="620" y="86" width="229.2" height="14" rx="2" fill="#8a8a95"/>
<text x="855.2" y="97" class="v">2,990</text>
<text x="470" y="127" class="n">llama.cpp</text>
