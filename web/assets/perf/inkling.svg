<text x="30" y="270" class="f">M5 Max 128 GB, 4,096-token prompt, 128 answer tokens, median of 3 interleaved runs, 2026-11-26. Weights differ: Saetta mlx-community 4-bit (17 GB),</text>
<text x="30" y="288" class="f">llama.cpp Unsloth UD-Q4_K_XL (17.6 GB), Strata lossless SQ-20 (19.3 GB). Saetta's Inkling prompt reading does not use the M5's tensor ops yet.</text>
<text x="30" y="306" class="f">Prompt lookup's gain depends on the prompt; Strata's DSpark row ran on its synthetic benchmark prompt.</text>
