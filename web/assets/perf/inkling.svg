<text x="404.0" y="97" class="v">85.3</text>
<text x="30" y="127" class="n">Saetta</text>
<rect x="180" y="116" width="149.8" height="14" rx="2" fill="url(#g)"/>
<text x="335.8" y="127" class="v">58.6</text>
<text x="30" y="157" class="n">Strata</text>
<rect x="180" y="146" width="138.5" height="14" rx="2" fill="#8a8a95"/>
<text x="324.5" y="157" class="v">54.2</text>
<text x="30" y="187" class="n">llama.cpp</text>
<rect x="180" y="176" width="120.6" height="14" rx="2" fill="#8a8a95"/>
